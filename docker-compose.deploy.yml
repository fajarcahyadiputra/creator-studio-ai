services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-creator_studio}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "${MINIO_BIND_HOST:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_HOST:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-creator-media}
      MINIO_USERS_EXPIRE_DAYS: ${MINIO_USERS_EXPIRE_DAYS:-2}
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET_MEDIA" &&
        mc anonymous set none "local/$$S3_BUCKET_MEDIA" &&
        mc ilm rule add --expire-days "$$MINIO_USERS_EXPIRE_DAYS" --prefix 'users/' "local/$$S3_BUCKET_MEDIA" || true

  temporal:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creator}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
    ports:
      - "${TEMPORAL_BIND_HOST:-127.0.0.1}:${TEMPORAL_PORT:-7233}:7233"

  temporal-ui:
    environment:
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${TEMPORAL_UI_BIND_HOST:-127.0.0.1}:${TEMPORAL_UI_PORT:-8080}:8080"

  web-node:
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000"

  mailpit:
    ports:
      - "${MAILPIT_SMTP_BIND_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_BIND_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"

  prometheus:
    ports:
      - "${PROMETHEUS_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
