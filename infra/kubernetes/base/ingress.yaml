apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creator-studio
  namespace: creator-studio
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [creator.example.com]
      secretName: creator-studio-tls
  rules:
    - host: creator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-node
                port: { name: http }
